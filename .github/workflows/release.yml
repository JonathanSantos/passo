name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Empacotar
        shell: bash
        run: |
          name="passo-${{ matrix.target }}"
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "dist/$name.zip" "./target/${{ matrix.target }}/release/passo.exe" > /dev/null
            (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")
          else
            tar -C "target/${{ matrix.target }}/release" -czf "dist/$name.tar.gz" passo
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: passo-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # The installers, run against the version just published, on each system.
  verify:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os != 'Windows'
        shell: bash
        env:
          PASSO_VERSION: ${{ github.ref_name }}
          PASSO_INSTALL_DIR: ${{ runner.temp }}/passo-bin
        run: |
          sh install.sh
          "$PASSO_INSTALL_DIR/passo" --version | grep -x "passo ${PASSO_VERSION#v}"
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          PASSO_VERSION: ${{ github.ref_name }}
          PASSO_INSTALL_DIR: ${{ runner.temp }}\passo-bin
        run: |
          ./install.ps1
          $version = & "$env:PASSO_INSTALL_DIR\passo.exe" --version
          if ($version -ne "passo $($env:PASSO_VERSION.TrimStart('v'))") { throw "versão inesperada: $version" }
