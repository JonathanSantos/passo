name: Setup Passo
description: Instala o Passo (harness para agentes de IA) num workflow do GitHub Actions, inclusive no ambiente do Copilot coding agent.
branding:
  icon: bar-chart-2
  color: green
inputs:
  version:
    description: Versão (tag), ou latest
    default: latest
runs:
  using: composite
  steps:
    - if: runner.os != 'Windows'
      shell: bash
      env:
        PASSO_VERSION: ${{ inputs.version }}
        PASSO_INSTALL_DIR: ${{ runner.temp }}/passo-bin
      run: |
        sh "${{ github.action_path }}/install.sh"
        echo "$PASSO_INSTALL_DIR" >> "$GITHUB_PATH"
    - if: runner.os == 'Windows'
      shell: pwsh
      env:
        PASSO_VERSION: ${{ inputs.version }}
        PASSO_INSTALL_DIR: ${{ runner.temp }}\passo-bin
      run: |
        & "${{ github.action_path }}\install.ps1"
        Add-Content -Path $env:GITHUB_PATH -Value $env:PASSO_INSTALL_DIR
